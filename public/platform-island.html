<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIBPO 營運島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2b2a33;
    --ink2: #5d5a69;
    --ink3: #8e8a99;
    --paper: #fffaf2;
    --paper2: #fff1de;
    --line: rgba(43, 42, 51, .12);
    --teal: #0d9488;
    --teal2: #14b8a6;
    --cyan: #06b6d4;
    --warm: #f97316;
    --shadow: 4px 4px 0 var(--ink);
    --shadow-s: 2px 2px 0 var(--ink);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: linear-gradient(180deg, #f9c592 0%, #fcdcbc 30%, #f7e6d3 58%, #f7e6d3 100%);
    font-family: "Noto Sans TC", system-ui, sans-serif; color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  .num { font-family: "Fredoka", "Noto Sans TC", sans-serif; }
  #scene { position: fixed; inset: 0; }
  #scene canvas { display: block; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-weight: 700; color: var(--ink2); z-index: 1; }

  /* 微縮模型的移軸景深：上下邊緣輕微模糊 */
  .tilt { position: fixed; left: 0; right: 0; pointer-events: none; z-index: 2;
    backdrop-filter: blur(2.5px); -webkit-backdrop-filter: blur(2.5px); }
  .tilt.top { top: 0; height: 26vh; -webkit-mask-image: linear-gradient(180deg, #000 10%, transparent); mask-image: linear-gradient(180deg, #000 10%, transparent); }
  .tilt.bottom { bottom: 0; height: 20vh; -webkit-mask-image: linear-gradient(0deg, #000 10%, transparent); mask-image: linear-gradient(0deg, #000 10%, transparent); }

  .card { background: rgba(255, 250, 242, .93); border: 2px solid var(--ink); border-radius: 18px; box-shadow: var(--shadow);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

  /* 左上：品牌＋即時數字＋搜尋 */
  .brand { position: fixed; top: 16px; left: 16px; z-index: 10; width: 340px; padding: 14px 16px 12px; }
  .brand-top { display: flex; align-items: center; gap: 10px; }
  .logo { width: 40px; height: 40px; flex: none; }
  .brand h1 { margin: 0; font: 700 22px/1 "Fredoka", sans-serif; letter-spacing: .5px; }
  .brand h1 span { color: var(--teal); }
  .brand .sub { margin-top: 3px; font-size: 12px; color: var(--ink2); display: flex; align-items: center; gap: 6px; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 0 rgba(34,197,94,.6); animation: ping 1.6s infinite; }
  .paused .live-dot { background: var(--ink3); animation: none; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(34,197,94,.55); } 80%,100% { box-shadow: 0 0 0 7px rgba(34,197,94,0); } }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
  .stat { background: #fff; border: 1.5px solid var(--line); border-radius: 12px; padding: 6px 8px; }
  .stat b { display: block; font: 600 20px/1.1 "Fredoka", sans-serif; }
  .stat small { font-size: 11px; color: var(--ink2); }
  .stat.bump b { animation: bump .6s; }
  @keyframes bump { 30% { transform: scale(1.25); color: var(--teal); } }

  .search { position: relative; margin-top: 10px; }
  .search input { width: 100%; height: 38px; border: 2px solid var(--ink); border-radius: 12px; padding: 0 12px 0 34px; font: inherit; font-size: 14px; background: #fff; outline: none; }
  .search input:focus { box-shadow: 0 0 0 4px rgba(20,184,166,.25); }
  .search svg { position: absolute; left: 11px; top: 11px; width: 16px; height: 16px; color: var(--ink2); }
  .search kbd { position: absolute; right: 10px; top: 9px; font: 600 11px "Fredoka"; border: 1.5px solid var(--line); border-radius: 6px; padding: 1px 6px; color: var(--ink3); background: var(--paper); }
  .results { position: absolute; left: 0; right: 0; top: 44px; max-height: 50vh; overflow: auto; padding: 6px; display: none; z-index: 20; }
  .results.open { display: block; }
  .results .grp { font-size: 11px; color: var(--ink3); padding: 6px 8px 2px; font-weight: 700; }
  .results button { display: flex; width: 100%; text-align: left; gap: 8px; align-items: center; border: 0; background: none; padding: 7px 8px; border-radius: 10px; cursor: pointer; }
  .results button:hover, .results button.act { background: var(--paper2); }
  .results .dot { width: 10px; height: 10px; border-radius: 3px; transform: rotate(30deg); flex: none; background: var(--c); }
  .results .t { flex: 1; min-width: 0; }
  .results .t b { display: block; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .results .t small { color: var(--ink3); font-size: 11px; }
  .results mark { background: #fde68a; color: inherit; border-radius: 3px; }
  .results .empty { padding: 12px; font-size: 13px; color: var(--ink2); }

  /* 右側：模組清單／細部資訊 */
  .panel { position: fixed; top: 16px; right: 16px; bottom: 88px; width: 380px; z-index: 10; display: flex; flex-direction: column; overflow: hidden; }
  .panel-head { padding: 14px 16px 10px; border-bottom: 2px dashed var(--line); display: flex; align-items: center; gap: 10px; flex: none; }
  .panel-head .eyebrow { font: 600 11px "Fredoka"; letter-spacing: 1.5px; color: var(--teal); }
  .panel-head h2 { margin: 2px 0 0; font-size: 18px; font-weight: 900; }
  .icon-btn { width: 34px; height: 34px; border-radius: 10px; border: 2px solid var(--ink); background: #fff; cursor: pointer; display: grid; place-items: center; flex: none; box-shadow: var(--shadow-s); }
  .icon-btn:active { transform: translate(2px,2px); box-shadow: none; }
  .icon-btn svg { width: 16px; height: 16px; }
  .panel-toggle { margin-left: auto; }
  .panel-toggle svg, .min-btn svg { transition: transform .2s; }
  .panel.collapsed .panel-toggle svg, .collapsed .min-btn svg { transform: rotate(180deg); }
  .min-btn { width: 28px; height: 28px; flex: none; border-radius: 9px; border: 1.5px solid var(--line); background: #fff; color: var(--ink2); display: grid; place-items: center; cursor: pointer; margin-left: auto; }
  .min-btn:hover { border-color: var(--ink); color: var(--ink); }
  .min-btn svg { width: 14px; height: 14px; }
  .brand.collapsed .stats { display: none; }
  .log.collapsed ul { display: none; }
  .log.collapsed .log-head { border-bottom: 0; }
  .log-head .min-btn { margin-left: 6px; }
  .log li.empty { cursor: default; color: var(--ink3); }
  .log li.empty:hover { background: none; }
  body.ui-off .brand, body.ui-off .panel, body.ui-off .log { display: none; }
  @media (min-width: 761px) {
    .panel.collapsed { bottom: auto; }
    .panel.collapsed .panel-body { display: none; }
    .panel.collapsed .panel-head { border-bottom: 0; }
  }
  .panel-body { overflow-y: auto; padding: 12px 14px 18px; flex: 1; scrollbar-width: thin; }
  .list-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink2); padding: 0 4px 8px; }
  .list-head b { font-family: "Fredoka"; color: var(--ink); font-size: 14px; }
  .mod { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: #fff; border: 1.5px solid var(--line); border-radius: 14px; padding: 9px 10px; margin-bottom: 7px; cursor: pointer; transition: transform .15s, border-color .15s; }
  .mod:hover { transform: translateX(-3px); border-color: var(--c); }
  .mod.dim { opacity: .4; }
  .no { width: 30px; height: 30px; flex: none; display: grid; place-items: center; font: 600 12px "Fredoka"; color: #fff; background: var(--c);
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
  .mod .nm { flex: 1; min-width: 0; }
  .mod .nm b { display: block; font-size: 14px; }
  .mod .nm small { font: 500 11px "Fredoka"; color: var(--ink3); letter-spacing: .3px; }
  .mod .cnt { font: 600 18px "Fredoka"; }
  .mod .arr { color: var(--ink3); font-size: 13px; }
  i.live { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; display: inline-block; flex: none; animation: ping 1.6s infinite; }

  .d-hero { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .d-hero .no { width: 46px; height: 46px; font-size: 16px; }
  .d-hero h2 { margin: 0; font-size: 20px; font-weight: 900; }
  .d-hero .en { margin: 1px 0 0; font: 500 12px "Fredoka"; color: var(--ink3); }
  .d-hero .pill { margin-left: auto; }
  .desc { margin: 0 0 12px; font-size: 13px; line-height: 1.65; color: var(--ink2); }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .kpi { background: #fff; border: 1.5px solid var(--line); border-radius: 14px; padding: 9px 11px; }
  .kpi .kl { font-size: 11.5px; color: var(--ink2); display: flex; align-items: center; gap: 3px; }
  .kpi b { display: block; margin-top: 2px; font: 600 22px/1.15 "Fredoka", sans-serif; }
  .kpi b small { font: 500 12px "Noto Sans TC"; color: var(--ink2); margin-left: 3px; }
  .kpi.bump b { animation: bump .6s; }
  .tip { width: 14px; height: 14px; border-radius: 50%; border: 1.3px solid var(--ink3); color: var(--ink3); font: 700 9px/11px "Fredoka"; font-style: normal; display: inline-grid; place-items: center; cursor: help; }
  .tip:hover, .tip:focus { color: var(--teal); border-color: var(--teal); outline: none; }
  #tooltip { position: fixed; z-index: 100; max-width: 260px; background: var(--ink); color: #fff; font-size: 12px; line-height: 1.55; padding: 8px 10px; border-radius: 10px; pointer-events: none; display: none; }

  .collab { background: var(--paper2); border-radius: 14px; padding: 10px 12px; margin-bottom: 14px; font-size: 12px; }
  .collab .ln { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 3px 0; }
  .collab .lbl { color: var(--ink2); width: 34px; flex: none; }
  .chip { border: 1.5px solid var(--c); color: var(--ink); background: #fff; border-radius: 999px; padding: 2px 9px 2px 7px; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
  .chip::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: var(--c); transform: rotate(30deg); }
  .chip small { color: var(--ink3); }
  h3 { font-size: 13px; margin: 16px 2px 8px; display: flex; align-items: center; gap: 6px; }
  h3 span { font: 600 12px "Fredoka"; color: var(--ink3); }
  .rows { background: #fff; border: 1.5px solid var(--line); border-radius: 14px; overflow: hidden; }
  .row { display: flex; gap: 10px; align-items: center; padding: 9px 12px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row .rt { flex: 1; min-width: 0; }
  .row .rt b { display: block; font-size: 13px; font-weight: 500; }
  .row .rt small { display: block; color: var(--ink3); font-size: 11.5px; margin-top: 1px; }
  .row .rr { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex: none; }
  .row .rr small { color: var(--ink3); font-size: 11px; }
  .row.flash { animation: flash 2.2s; }
  @keyframes flash { 0%, 40% { background: #fef3c7; } 100% { background: transparent; } }
  .bar { position: relative; height: 7px; border-radius: 99px; background: #f1ece4; margin-top: 6px; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: var(--c, var(--teal2)); transition: width .6s; }
  .bar u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); border-radius: 2px; }
  .pill { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; border: 1.5px solid; }
  .pill.run { color: #0f766e; background: #ccfbf1; border-color: #5eead4; }
  .pill.done { color: #166534; background: #dcfce7; border-color: #86efac; }
  .pill.warn { color: #92400e; background: #fef3c7; border-color: #fcd34d; }
  .pill.bad { color: #9f1239; background: #ffe4e6; border-color: #fda4af; }
  .pill.idle { color: var(--ink2); background: #f4f1ec; border-color: #ddd6cb; }
  .pill.run::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 4px; vertical-align: 1px; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .more { font-size: 12px; color: var(--ink3); padding: 8px 12px; border-top: 1px solid var(--line); }

  /* 左下：即時日誌 */
  .log { position: fixed; left: 16px; bottom: 88px; width: 340px; max-height: 236px; z-index: 9; display: flex; flex-direction: column; overflow: hidden; }
  .log.hide { display: none; }
  .log-head { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-bottom: 2px dashed var(--line); font-size: 13px; font-weight: 700; }
  .log-head small { margin-left: auto; font: 500 11px "Fredoka"; color: var(--ink3); }
  .log ul { list-style: none; margin: 0; padding: 4px 8px 8px; overflow-y: auto; }
  .log li { display: flex; gap: 8px; align-items: flex-start; padding: 6px; border-radius: 10px; font-size: 12.5px; line-height: 1.45; cursor: pointer; }
  .log li:hover { background: var(--paper2); }
  .log li.new { animation: slidein .5s; }
  @keyframes slidein { from { opacity: 0; transform: translateY(-8px); background: #fef3c7; } }
  .log li .dot { width: 9px; height: 9px; border-radius: 3px; transform: rotate(30deg); background: var(--c); flex: none; margin-top: 5px; }
  .log li time { font: 500 11px "Fredoka"; color: var(--ink3); flex: none; margin-top: 1px; }

  /* 底部工具列 */
  .toolbar { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 11; display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 18px; }
  .tb { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 54px; padding: 5px 6px; border: 0; background: none; border-radius: 12px; cursor: pointer; font-size: 11px; color: var(--ink2); }
  .tb svg { width: 18px; height: 18px; color: var(--ink); }
  .tb:hover { background: var(--paper2); }
  .tb.on { background: var(--ink); color: #fff; }
  .tb.on svg { color: #fff; }
  .tb-sep { width: 2px; align-self: stretch; background: var(--line); margin: 4px 2px; }
  .toolbar select { height: 38px; border: 2px solid var(--ink); border-radius: 12px; padding: 0 8px; font: inherit; font-size: 13px; background: #fff; cursor: pointer; max-width: 150px; }

  /* 島上名牌 */
  .tags-off .tag { display: none; }
  .tag { pointer-events: auto; cursor: pointer; }
  .tag > div { display: flex; align-items: center; gap: 6px; background: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: 3px 10px 3px 3px; box-shadow: var(--shadow-s); font-size: 12.5px; white-space: nowrap; transition: transform .2s, opacity .2s; }
  .tag .no { width: 22px; height: 22px; font-size: 10px; }
  .tag b { font-weight: 700; }
  .tag .n { font: 600 13px "Fredoka"; color: var(--ink2); }
  .tag:hover > div, .tag.hover > div { transform: translateY(-3px) scale(1.06); }
  .tag.sel > div { background: var(--ink); color: #fff; }
  .tag.sel .n { color: #fde68a; }
  .tag.dim > div { opacity: .3; }
  .tag.match > div { box-shadow: 0 0 0 4px #fde68a, var(--shadow-s); }
  .tag.pop > div { animation: pop .7s; }
  @keyframes pop { 30% { transform: translateY(-6px) scale(1.15); } }

  /* 導覽 */
  .tour { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(43,42,51,.28); }
  .tour.hide { display: none; }
  .tour .card { width: min(400px, calc(100vw - 32px)); padding: 22px 22px 18px; }
  .tour .eyebrow { font: 600 11px "Fredoka"; letter-spacing: 1.5px; color: var(--teal); }
  .tour h2 { margin: 6px 0 8px; font-size: 22px; font-weight: 900; }
  .tour p { margin: 0; font-size: 14px; line-height: 1.7; color: var(--ink2); }
  .tour .acts { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; }
  .tour .dots { display: flex; gap: 5px; }
  .tour .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  .tour .dots i.on { background: var(--ink); width: 18px; border-radius: 9px; }
  .btn { border: 2px solid var(--ink); border-radius: 12px; padding: 7px 14px; background: #fff; cursor: pointer; font-weight: 700; font-size: 13px; box-shadow: var(--shadow-s); }
  .btn.pri { background: var(--ink); color: #fff; }
  .btn.ghost { border-color: transparent; box-shadow: none; background: none; color: var(--ink2); }

  @media (max-width: 760px) {
    .brand { left: 8px; right: 8px; top: 8px; width: auto; padding: 10px 12px; }
    .brand h1 { font-size: 18px; }
    .logo { width: 32px; height: 32px; }
    .stats { margin-top: 8px; }
    .stat { padding: 4px 6px; }
    .stat b { font-size: 16px; }
    .panel { top: auto; left: 8px; right: 8px; bottom: 76px; width: auto; height: 52vh; }
    .panel.collapsed { height: 62px; }
    .panel.collapsed .panel-body { display: none; }
    .panel-toggle { display: grid; }
    .log { left: 8px; right: 8px; width: auto; bottom: 76px; max-height: 30vh; }
    .toolbar { bottom: 8px; left: 8px; right: 8px; transform: none; overflow-x: auto; justify-content: flex-start; }
    .tb { min-width: 48px; }
    .toolbar select { max-width: 120px; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="loading">正在搭建營運島…</div>
<div id="scene"></div>
<div class="tilt top"></div>
<div class="tilt bottom"></div>

<header class="brand card">
  <div class="brand-top">
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
      <polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="#14b8a6" stroke="#2b2a33" stroke-width="2.5" stroke-linejoin="round"/>
      <polygon points="20,10 28,14.5 28,23.5 20,28 12,23.5 12,14.5" fill="#fffaf2" stroke="#2b2a33" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="20" cy="19" r="3.2" fill="#f97316"/>
    </svg>
    <div>
      <h1>AIBPO <span>ISLAND</span></h1>
      <div class="sub"><i class="live-dot"></i><span id="liveText">即時營運中</span>・<span id="clock" class="num"></span></div>
    </div>
    <button class="min-btn" id="brandMin" type="button" aria-label="收合或展開數字" title="收合／展開"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
  </div>
  <div class="stats">
    <div class="stat" id="st-company"><b class="num">0</b><small>公司</small></div>
    <div class="stat" id="st-users"><b class="num">0</b><small>帳號</small></div>
    <div class="stat" id="st-running"><b class="num">0</b><small>進行中作業</small></div>
    <div class="stat" id="st-events"><b class="num">0</b><small>今日事件</small></div>
  </div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="搜尋模組、公司、帳號、作業…" autocomplete="off" aria-label="關鍵字搜尋">
    <kbd>/</kbd>
    <div class="results card" id="results"></div>
  </div>
</header>

<aside class="panel card" id="panel">
  <div class="panel-head" id="panelHead"></div>
  <div class="panel-body" id="panelBody"></div>
</aside>

<section class="log card" id="log">
  <div class="log-head"><i class="live-dot"></i>即時日誌<small id="logCount"></small><button class="min-btn" id="logMin" type="button" aria-label="收合或展開日誌" title="收合／展開"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button></div>
  <ul id="logList"></ul>
</section>

<nav class="toolbar card" aria-label="工具列">

function optimizeStats(D, type) {
  const jobs = D.jobs.filter((j) => j.type === type);
  const run = jobs.filter((j) => j.status === "RUNNING");
  const scores = jobs.map((j) => j.score).filter((s) => s != null);
  const versions = jobs.reduce((a, j) => a + j.versions, 0);
  return { total: jobs.length, running: run.length, units: clamp(Math.ceil(versions / 4), 2, 12),
    kpis: [["進行中", run.length, "個", `正在自動跑的 ${type}優化任務。`], ["最佳分數", scores.length ? Math.max(...scores) : "—", scores.length ? "%" : "", "各任務最新一版答對率中最高的。"],
      ["累計版本", versions, "版", "每跑一輪產生一個版本，可以預覽、比較或從某版繼續。"], ["達標任務", jobs.filter((j) => j.score != null && j.score >= j.target).length, "個", "最新一版答對率達到目標分數的任務。"]],
    sections: [{ title: `${type} 優化任務`, items: jobs.slice().sort((a, b) => (b.status === "RUNNING") - (a.status === "RUNNING") || b.updatedAt - a.updatedAt).map((j) => ({
      id: j.id, title: j.name, sub: `${cname(j.companyId)}・第 ${j.round}/${j.maxRounds} 輪・${j.score ?? "—"}%（目標 ${j.target}%）${j.status === "RUNNING" && STEP[j.step] ? `・${STEP[j.step]}` : ""}`,
      status: j.status, progress: j.score != null ? { value: j.score, target: j.target } : null })) }] };
}

const r2 = (v) => Math.round(v * 100) / 100;

function hexShape(rad) { const s = new THREE.Shape(); for (let i = 0; i < 6; i++) { const a = Math.PI / 2 + (i * Math.PI) / 3; const x = Math.cos(a) * rad, y = Math.sin(a) * rad; i ? s.lineTo(x, y) : s.moveTo(x, y); } s.closePath(); return s; }
const GRASS_GEO = (() => { const g = new THREE.ExtrudeGeometry(hexShape(R - 0.12), { depth: 0.3, bevelEnabled: true, bevelThickness: 0.12, bevelSize: 0.12, bevelSegments: 3, curveSegments: 1 }); g.rotateX(-Math.PI / 2); return g; })();

const hexRing = (inner, outer) => { const g = new THREE.RingGeometry(inner, outer, 6, 1, Math.PI / 2); g.rotateX(-Math.PI / 2); return g; };

// 島上可以放建築的格位（排除中央地標區）

function unit(g, x, z, rot = 0) { const u = new THREE.Group(); u.position.set(x, TOP, z); u.rotation.y = rot; g.add(u); return u; }
function tree(g, x, z, r) {
  const u = unit(g, x, z, r() * 6); u.scale.setScalar(0.7 + r() * 0.5);

}

  u.add(mk(rbox(0.14, 0.22, 0.03, 0.01), mat("#8d6e53"), 0, 0.11, 0.27));

function bookstack(u, r) { let y = 0; for (let i = 0, k = randInt(r, 3, 5); i < k; i++) { const h = 0.1 + r() * 0.05; const b = mk(rbox(0.6 - r() * 0.12, h, 0.42, 0.02), mat(pick(r, BOOKS)), 0, y + h / 2, 0); b.rotation.y = (r() - 0.5) * 0.5; u.add(b); y += h; } }

  const h = 0.6 + r() * 0.5;

}

function buildDecor(island) {

  };

  const ql = q.toLowerCase();

  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (!btns.length) return; activeIdx = (activeIdx + (e.key === "ArrowDown" ? 1 : -1) + btns.length) % btns.length; btns.forEach((b, i) => b.classList.toggle("act", i === activeIdx)); btns[activeIdx].scrollIntoView({ block: "nearest" }); }
  else if (e.key === "Enter") { e.preventDefault(); chooseResult(results[activeIdx]); }
  else if (e.key === "Escape") { $("#q").value = ""; runSearch(); $("#q").blur(); }
});
$("#results").addEventListener("click", (e) => { const b = e.target.closest("button[data-i]"); if (b) chooseResult(results[+b.dataset.i]); });
document.addEventListener("pointerdown", (e) => { if (!e.target.closest(".search")) $("#results").classList.remove("open"); });
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
  if (e.key === "Escape" && document.activeElement !== $("#q") && state.selected) select(null);
});

/* =========================================================
   統計刷新、日誌、即時事件模擬
   ========================================================= */
function refreshStats(changed = []) {
  const D = view();
  for (const is of ISLANDS) {
    is.stats = STATS[is.key](D);
    is.active = is.stats.running > 0;
    is.el.querySelector(".n").textContent = is.key === "usage" ? `$${fmt(is.stats.total)}` : fmt(is.stats.total);
    is.el.querySelector(".live").hidden = !is.active;
    is.glass.emissiveIntensity = is.active ? 0.5 : 0.08;
    if (is.units !== is.stats.units) buildDecor(is);
  }
  const running = D.jobs.filter((j) => j.status === "RUNNING").length + D.sources.filter((s) => s.status === "ANALYZING").length +
    D.forms.filter((f) => f.status === "ANALYZING").length + D.tests.filter((t) => t.status === "RUNNING").length;
  setStat("st-company", D.companies.length); setStat("st-users", D.users.length); setStat("st-running", running); setStat("st-events", todayEvents());
  if (state.selected) renderDetail(state.selected);
  else renderList();
  changed.forEach((k) => { const el = byKey[k]?.el; if (el) { el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); } });
}
function setStat(id, v) { const el = document.getElementById(id); const b = el.querySelector("b"); if (b.textContent !== String(fmt(v))) { b.textContent = fmt(v); el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); } }

function addLog(e, fresh = true) {
  state.log.unshift(e);
  state.log.length = Math.min(state.log.length, 80);
  renderLog(fresh);
}
const todayEvents = () => state.log.filter((e) => e.t >= DATA.todayStart && inScope(e)).length;
function renderLog(fresh) {
  const list = state.log.filter((e) => state.company === "all" || !e.company || e.company === state.company).slice(0, 30);
  $("#logList").innerHTML = list.length ? list.map((e, i) => `<li class="${i === 0 && fresh ? "new" : ""}" data-key="${e.mod}" style="--c:${byKey[e.mod].color}"><span class="dot"></span><span style="flex:1">${esc(e.text)}</span><time>${hhmm(e.t)}</time></li>`).join("") : `<li class="empty">${MODE === "live" ? "近 48 小時沒有動態，有新動態會即時出現在這裡" : "等待動態…"}</li>`;
  $("#logCount").textContent = `今日 ${todayEvents()} 則`;
}
$("#logList").addEventListener("click", (e) => { const k = e.target.closest("li")?.dataset.key; if (k) select(k); });

const inScope = (ev) => state.company === "all" || !ev.company || ev.company === state.company;
function runFlows(flows, i = 0) {
  if (i >= flows.length) return;
  const [a, b] = flows[i];
  sendPacket(a, b, () => { const t = byKey[b]; t.pulse = 1; ripple(t); runFlows(flows, i + 1); });
}
// 播放一則動態：寫進日誌、島跳一下、光點沿協作線跑
function playEvent(ev) {
  addLog(ev, true);
  if (inScope(ev)) { byKey[ev.mod].pulse = 1; ripple(byKey[ev.mod]); runFlows(ev.flows ?? []); }
  refreshStats([ev.mod, ...(ev.flows ?? []).map((f) => f[1])]);
}

/* ---------- 正式資料：每 15 秒抓一次快照，用 activity 的 id 找出新動態 ---------- */
const seenActivity = new Set();
async function poll() {
  if (!state.paused) {
    try {
      const snap = await fetchSnapshot();
      DATA = snap;
      const fresh = snap.activity.filter((a) => !seenActivity.has(a.id)).sort((a, b) => a.t - b.t);
      fresh.forEach((a) => seenActivity.add(a.id));
      buildCompanyOptions();
      refreshStats();
      fresh.forEach((a, i) => setTimeout(() => playEvent(a), i * 1400));
      setLiveText();
    } catch (e) {
      $("#liveText").textContent = e.auth ? e.message : `${e.message}，稍後重試`;
    }
  }
  setTimeout(poll, POLL_MS);
}

/* ---------- 範例資料：模擬即時事件 ---------- */
function notify(companyId, text, failed = false) { DATA.notices.unshift({ id: nid("n"), companyId, text, status: "SENT", failed, at: Date.now() }); DATA.notices.length = Math.min(DATA.notices.length, 60); }
const pickC = () => pick(rand, DATA.companies);
const seedOf = (id) => SEED.find((x) => x.id === id);
const EVENTS = [
  [4, () => {
    const j = pick(rand, DATA.jobs.filter((x) => x.status === "RUNNING")); if (!j) return null;
    const mod = j.type === "RAG" ? "rag" : "faq"; const before = j.score ?? 60;
    j.round++; j.versions++; j.updatedAt = Date.now(); j.score = clamp(before + randInt(rand, -2, 6), 40, 99); j.step = pick(rand, ["UPLOAD", "TEST", "REVISE"]);
    const t = DATA.tests.find((x) => x.status === "RUNNING" && x.name.startsWith(j.name)); if (t) { t.status = "DONE"; t.completed = t.questions; t.pass = j.score; }
    const done = j.score >= j.target || j.round >= j.maxRounds;
    if (done) { j.status = "DONE"; notify(j.companyId, `${j.type}優化「${j.name}」完成通知`); }
    else DATA.tests.unshift({ id: nid("r"), companyId: j.companyId, name: `${j.name}・第 ${j.round + 1} 輪`, questions: randInt(rand, 80, 160), completed: 0, pass: null, status: "RUNNING", at: Date.now() });
    const u = DATA.usage.find((x) => x.companyId === j.companyId); u.tokensToday += randInt(rand, 40, 160) * 1000; u.costToday += randInt(rand, 4, 18); u.costMonth += randInt(rand, 4, 18);
    return { mod, company: j.companyId, text: done ? `${j.type}優化「${j.name}」完成，最後答對率 ${j.score}%` : `${j.type}優化「${j.name}」第 ${j.round} 輪完成，答對率 ${before}% → ${j.score}%`,
      flows: done ? [[mod, "bottest"], ["bottest", mod], [mod, "line"]] : [[mod, "bottest"], ["bottest", mod], [mod, "usage"]] };
  }],
  [2, () => {
    if (DATA.jobs.filter((x) => x.status === "RUNNING").length >= 6) return null;
    const c = pickC(); const type = rand() < 0.55 ? "RAG" : "FAQ";
    const j = { id: nid("j"), companyId: c.id, type, name: `${pick(rand, seedOf(c.id).topics)}（v${randInt(rand, 2, 9)}）`, status: "RUNNING", round: 0, maxRounds: 10, score: null, target: 90, versions: 0, step: "PREPARE", startedAt: Date.now(), updatedAt: Date.now() };
    DATA.jobs.push(j);
    const mod = type === "RAG" ? "rag" : "faq";
    return { mod, company: c.id, text: `開始 ${type}優化「${j.name}」`, flows: [["tally", mod]] };
  }],
  [2, () => {
    const s = pick(rand, DATA.sources.filter((x) => x.status === "ANALYZING"));
    if (s && rand() < 0.6) { s.status = "ANALYZED"; s.fields += randInt(rand, 3, 12); s.updatedAt = Date.now(); return { mod: "km", company: s.companyId, text: `來源「${s.title}」分析完成，產生 ${s.fields} 則條目`, flows: [["km", "tally"]] }; }
    const c = pickC(); const t = `${pick(rand, ["2026 新版", "補充", "門市版", "常見問答"])}${pick(rand, seedOf(c.id).topics)}`;
    DATA.sources.unshift({ id: nid("k"), companyId: c.id, title: t, files: randInt(rand, 1, 4), fields: 0, status: "ANALYZING", updatedAt: Date.now() });
    return { mod: "km", company: c.id, text: `上傳來源「${t}」`, flows: [["company", "km"]] };
  }],
  [2, () => {
    const c = pickC(); const sd = seedOf(c.id); const e = pick(rand, sd.entities);
    const t = DATA.docs.find((x) => x.companyId === c.id && x.entity === e);
    if (t) t.updatedAt = Date.now(); else { DATA.docs.unshift({ id: nid("t"), companyId: c.id, template: `${sd.cat}產品`, entity: e, updatedAt: Date.now() }); DATA.docTotals[c.id] = (DATA.docTotals[c.id] ?? 0) + 1; }
    return { mod: "tally", company: c.id, text: `結構化文件「${e}」已更新`, flows: [["km", "tally"], ["tally", "rag"]] };
  }],
  [1.5, () => {
    const f = pick(rand, DATA.forms.filter((x) => x.status === "ANALYZING"));
    if (f) { f.status = "READY"; f.updatedAt = Date.now(); return { mod: "automation", company: f.companyId, text: `表單「${f.name}」分析完成，${f.fields} 個欄位`, flows: [["automation", "usage"]] }; }
    const c = pickC(); const n = pick(rand, ["預約到府服務", "發票重開申請", "客訴登記表", "活動報名表"]);
    DATA.forms.push({ id: nid("f"), companyId: c.id, name: n, domain: `service.${seedOf(c.id).domain}`, status: "ANALYZING", fields: randInt(rand, 5, 16), updatedAt: Date.now() });
    return { mod: "automation", company: c.id, text: `登記表單「${n}」`, flows: [] };
  }],
  [3, () => {
    const a = pick(rand, DATA.agents.filter((x) => x.status === "ONLINE")); if (!a) return null;
    const n = randInt(rand, 3, 18);
    const u = DATA.usage.find((x) => x.companyId === a.companyId); u.chatsToday += n; u.tokensToday += n * 3200; u.costToday += Math.ceil(n * 0.6); u.costMonth += Math.ceil(n * 0.6);
    return { mod: "agent", company: a.companyId, text: `${a.name} 處理了 ${n} 則對話`, flows: [["skill", "agent"], ["agent", "usage"]] };
  }],
  [1, () => {
    const c = pick(rand, DATA.companies.filter((x) => DATA.users.filter((u) => u.companyId === x.id).length < 12)); if (!c) return null;
    const u = sampleUser(seedOf(c.id), Date.now(), false); DATA.users.push(u);
    return { mod: "company", company: c.id, text: `${c.name} 新增帳號 ${u.name}（${u.role}）`, flows: [] };
  }],
  [1, () => {
    const c = pickC(); const n = pick(rand, ["換貨流程", "會員升等", "預約提醒", "滿意度回訪"]);
    DATA.drafts.unshift({ id: nid("w"), companyId: c.id, name: n, confirmed: false, updatedAt: Date.now() });
    return { mod: "draft", company: c.id, text: `產生 Workflow 草稿「${n}」`, flows: [["km", "draft"]] };
  }],
];
function simulate() {
  if (!state.paused) {
    const total = EVENTS.reduce((a, [w]) => a + w, 0);
    let x = rand() * total, ev = null;
    for (const [w, fn] of EVENTS) { x -= w; if (x <= 0) { ev = fn(); break; } }
    if (ev) { ev.t = Date.now(); ev.id = nid("e"); playEvent(ev); }
  }
  setTimeout(simulate, 2200 + rand() * 2200);
}

/* =========================================================
   動畫迴圈
   ========================================================= */
const clock = new THREE.Clock();
const tmpV = new THREE.Vector3();
let frame = 0;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  frame++;
  if (frame % 2 === 0) updateWater(t);

  if (fly) {
    const k = clamp((performance.now() - fly.t0) / fly.dur, 0, 1);
    const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    controls.target.lerpVectors(fly.fromT, fly.toT, e);
    camera.position.lerpVectors(fly.fromP, fly.toP, e);
    if (k >= 1) fly = null;
  }
  controls.update();

  for (const is of ISLANDS) {
    const target = is.key === state.selected ? 0.45 : is.key === state.hover ? 0.28 : 0;
    is.lift += (target - is.lift) * Math.min(1, dt * 8);
    is.pulse = Math.max(0, is.pulse - dt * 1.4);
    is.group.position.y = is.lift + Math.sin(is.pulse * Math.PI) * 0.18;
    is.glow.emissiveIntensity = is.active ? 0.55 + Math.sin(t * 4 + is.idx) * 0.35 : 0.12;
    is.foam.material.opacity = 0.22 + Math.sin(t * 1.3 + is.idx) * 0.1;
    for (const a of is.anims) a(t, dt);
  }
  selRing.material.opacity = 0.55 + Math.sin(t * 4) * 0.35;

  for (const b of bridges) {
    const busy = byKey[b.a].active || byKey[b.b].active;
    const k = Math.sin(t * b.speed * (busy ? 2.2 : 1) + b.phase);
    b.car.position.set(k * (b.len / 2 - 0.35), 0, b.lane);
    b.car.rotation.y = Math.cos(t * b.speed * (busy ? 2.2 : 1) + b.phase) > 0 ? 0 : Math.PI;
  }
  if (linkGroup.visible) for (const l of links) l.dots.forEach((d, i) => { l.curve.getPoint((t * l.speed + l.phase + i / 3) % 1, tmpV); d.position.copy(tmpV); });

  for (let i = packets.length - 1; i >= 0; i--) {
    const p = packets[i]; p.t += dt / 1.3;
    const k = clamp(p.t, 0, 1); p.l.curve.getPoint(p.reverse ? 1 - k : k, tmpV); p.core.position.copy(tmpV);
    if (p.t >= 1) { scene.remove(p.core); p.core.material.dispose(); p.core.children[0].material.dispose(); packets.splice(i, 1); p.onArrive?.(); }
  }
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i]; r.t += dt;
    r.m.scale.setScalar(1 + r.t * 0.45); r.m.material.opacity = Math.max(0, 0.8 - r.t * 0.8);
    if (r.t > 1) { scene.remove(r.m); r.m.geometry.dispose(); r.m.material.dispose(); ripples.splice(i, 1); }
  }
  for (const c of clouds) { c.position.x += c.userData.speed * dt; if (c.position.x > 70) c.position.x = -70; }

  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

// 開場：先抓資料（正式環境），抓不到 API 就用範例資料
async function boot() {
  if (location.protocol !== "file:") {
    try { DATA = await fetchSnapshot(); MODE = "live"; }
    catch (e) { if (e.auth) { showFatal(e.message); return; } }
  }
  if (!DATA) {
    DATA = sampleData();
    [["rag", "c1", "RAG優化「冰箱維修手冊（v1）」第 3 輪完成，答對率 71% → 76%"], ["automation", "c3", "表單「網路報修單」分析完成，12 個欄位"], ["km", "c2", "來源「退換貨政策」分析完成，產生 24 則條目"],
      ["agent", "c1", "星河客服小星 處理了 12 則對話"], ["line", "c3", "FAQ優化「資費方案總表（v1）」完成通知"], ["tally", "c1", "結構化文件「S60 吸塵器」已更新"]]
      .forEach(([mod, company, text], i) => state.log.push({ id: `seed${i}`, mod, company, text, t: Date.now() - (i + 1) * 4 * MIN, flows: [] }));
  } else {
    for (const a of DATA.activity) { seenActivity.add(a.id); state.log.push(a); }
    state.log.sort((x, y) => y.t - x.t);
  }
  buildCompanyOptions();
  setLiveText();
  refreshStats();
  renderLog(false);
  animate();
  if (MODE === "live") setTimeout(poll, POLL_MS);
  else setTimeout(simulate, 1800);
  if (!store.get("aibpo-island-tour")) openTour(0);
}
boot();
